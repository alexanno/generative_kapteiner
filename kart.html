<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kart — Loggbok Robot</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root {
      --bg: #f4efe5;
      --paper: #fbf8f1;
      --ink: #1f2a2e;
      --muted: #6e7068;
      --accent: #164b63;
      --accent-soft: #dbe7ec;
      --border: #d3cab8;
      --shadow: 0 18px 40px rgba(41, 34, 24, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background: var(--bg);
    }

    header {
      padding: 14px 24px;
      background: color-mix(in srgb, var(--paper) 92%, white 8%);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      gap: 20px;
      flex-shrink: 0;
    }

    .header-title {
      margin: 0;
      font-size: 1.3rem;
      color: var(--ink);
    }

    .header-nav {
      display: flex;
      gap: 16px;
      font-size: 0.9rem;
    }

    .header-nav a {
      color: var(--accent);
      text-decoration: none;
    }

    .header-nav a:hover {
      text-decoration: underline;
    }

    #status-bar {
      padding: 6px 24px;
      font-size: 0.85rem;
      color: var(--muted);
      background: #f0ebe0;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #map {
      flex: 1;
    }

    .leaflet-popup-content-wrapper {
      border-radius: 14px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      font-family: Georgia, "Times New Roman", serif;
    }

    .popup-name {
      font-weight: 700;
      font-size: 1rem;
      margin: 0 0 4px;
      color: var(--ink);
    }

    .popup-coords {
      font-size: 0.8rem;
      color: var(--muted);
      margin: 0 0 8px;
    }

    .popup-date {
      font-size: 0.85rem;
      color: var(--muted);
      margin: 0 0 10px;
    }

    .popup-link {
      display: inline-block;
      font-size: 0.85rem;
      color: var(--accent);
      text-decoration: none;
    }

    .popup-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <h1 class="header-title">Loggbok Robot — Kart</h1>
    <nav class="header-nav">
      <a href="index.html">Loggliste</a>
      <a href="om.html">Om prosjektet</a>
    </nav>
  </header>

  <div id="status-bar">Laster oppføringer...</div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map("map", { zoomControl: true });

    L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
      subdomains: "abcd",
      maxZoom: 19,
    }).addTo(map);

    map.setView([58.5, 7.5], 6);

    function parseCoords(coordStr) {
      if (!coordStr) return null;
      const cleaned = coordStr.replace(/°/g, "").trim();
      const parts = cleaned.split(",").map((p) => parseFloat(p.trim()));
      if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
        return { lat: parts[0], lng: parts[1] };
      }
      return null;
    }

    function parseLog(markdown) {
      const lines = markdown.split(/\r?\n/);
      const result = { title: "", date: "", location: "", coordinates: "" };
      let section = null;

      for (const line of lines) {
        if (line.startsWith("# ")) {
          result.title = line.replace(/^#\s+/, "").trim();
        } else if (line.startsWith("**Dato**:")) {
          result.date = line.split(":").slice(1).join(":").trim();
        } else if (line === "## Plassering") {
          section = "location";
        } else if (line.startsWith("## ")) {
          section = null;
        } else if (section === "location") {
          if (line.startsWith("- **Navn**:")) {
            result.location = line.split(":").slice(1).join(":").trim();
          } else if (line.startsWith("- **Koordinater**:")) {
            result.coordinates = line.split(":").slice(1).join(":").trim();
          }
        }
      }
      return result;
    }

    function formatDate(isoString) {
      if (!isoString) return "";
      const d = new Date(isoString);
      if (isNaN(d)) return isoString;
      return new Intl.DateTimeFormat("nb-NO", { dateStyle: "medium", timeStyle: "short" }).format(d);
    }

    async function loadRegistry() {
      const resp = await fetch("registry.json", { cache: "no-store" });
      if (!resp.ok) throw new Error("Kunne ikke laste registry.json");
      return resp.json();
    }

    function normalizeEntries(registry) {
      return (registry.entries || [])
        .filter((e) => e && typeof e.filename === "string")
        .filter((e) => /skipsdagbok_\d{8}_\d{6}\.md$/.test(e.filename));
    }

    async function init() {
      const statusBar = document.getElementById("status-bar");

      let entries;
      try {
        const registry = await loadRegistry();
        entries = normalizeEntries(registry);
      } catch (err) {
        statusBar.textContent = "Feil: " + err.message;
        return;
      }

      statusBar.textContent = `Laster ${entries.length} oppføringer...`;

      const markers = [];
      let loaded = 0;
      let failed = 0;

      await Promise.allSettled(
        entries.map(async (entry) => {
          try {
            const resp = await fetch(entry.filename, { cache: "no-store" });
            if (!resp.ok) throw new Error("HTTP " + resp.status);
            const markdown = await resp.text();
            const parsed = parseLog(markdown);
            const coords = parseCoords(parsed.coordinates);
            if (!coords) return;

            const marker = L.circleMarker([coords.lat, coords.lng], {
              radius: 7,
              color: "#164b63",
              fillColor: "#164b63",
              fillOpacity: 0.65,
              weight: 1.5,
            });

            const popupHtml = `
              <p class="popup-name">${parsed.location || parsed.title}</p>
              <p class="popup-coords">${parsed.coordinates}</p>
              <p class="popup-date">${formatDate(entry.timestamp)}</p>
              <a class="popup-link" href="index.html#${encodeURIComponent(entry.filename)}">Åpne logg &rarr;</a>
            `;
            marker.bindPopup(popupHtml);
            markers.push({ marker, lat: coords.lat, lng: coords.lng });
            loaded++;
          } catch {
            failed++;
          }
        })
      );

      for (const { marker } of markers) {
        marker.addTo(map);
      }

      if (markers.length > 0) {
        const lats = markers.map((m) => m.lat);
        const lngs = markers.map((m) => m.lng);
        const bounds = L.latLngBounds(
          [Math.min(...lats), Math.min(...lngs)],
          [Math.max(...lats), Math.max(...lngs)]
        );
        map.fitBounds(bounds, { padding: [40, 40] });
      }

      const parts = [`${loaded} steder vist på kartet`];
      if (failed > 0) parts.push(`${failed} kunne ikke lastes`);
      statusBar.textContent = parts.join(" · ");
    }

    init().catch((err) => {
      document.getElementById("status-bar").textContent = "Uventet feil: " + err.message;
    });
  </script>
</body>
</html>
